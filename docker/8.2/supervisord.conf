[program:php]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[supervisord]
logfile=/var/log/supervisor/supervisord.log ; main log file; default $CWD/supervisord.log
logfile_maxbytes=5MB         ; max main logfile bytes b4 rotation; default 50MB
logfile_backups=10           ; # of main logfile backups; 0 means none, default 10
loglevel=info                ; log level; default info; others: debug,warn,trace
nodaemon=true              ; start in foreground if true; default false
minfds=1024                  ; min. avail startup file descriptors; default 1024
minprocs=200                 ; min. avail process descriptors;default 200
user=root
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock ; use a unix:// URL  for a unix socket

[program:laravel-worker] ; tên chương trình
process_name=%(program_name)s_%(process_num)02d ; Định dạng tên quy trình VD: laravel-worker_01
command=php /var/www/html/artisan queue:work ; Là lệnh để thực thi
autostart=true ; Để tự động bắt đầu khi supervisor được khởi động
autorestart=true ; Để tự động khởi động lại nếu như chương trình gặp lỗi
stopasgroup=true ; Khi dừng chương trình thì sẽ stop hết tất cả các tiến trình con
killasgroup=true ; Khi chương trình bị kill thì sẽ kill luôn tất cả các chương trình con
numprocs=1 ; Số lượng worker được thiết lập để chạy
redirect_stderr=true ; Chuyển hướng tất cả lỗi sang stdout
stdout_logfile=/var/www/html/storage/logs/worker.log ; Là đường dẫn đến tập tin log cho đầu ra stdout. Cũng là tên file
stopwaitsecs=3600 ; Là khoảng thời gian chờ trước khi tắt tiến trình
stdout_logfile_maxbytes=5MB ; Kích thước tối đa của tập tin log

[program:laravel-scheduler]
command=php /var/www/html/artisan schedule:run >> /dev/null 2>&1
autostart=true
autorestart=true
stderr_logfile=/var/log/laravel-scheduler.err.log
stdout_logfile=/var/log/laravel-scheduler.out.log